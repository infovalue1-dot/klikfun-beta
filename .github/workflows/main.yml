name: Gemini Klikfun File Input Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gemini-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Klikfun source
        run: |
          head -c 12000 index.html > /tmp/klikfun-source.txt

      - name: Gemini analyze supplied source
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3-flash-preview
        run: |
          npm install --silent --no-audit --global @google/gemini-cli

          {
            echo "Analyze the following excerpt from Klikfun index.html."
            echo "Do not access or inspect any repository files yourself."
            echo "Do not use tools."
            echo "Briefly explain what this code appears to do."
            echo "End with exactly: GEMINI_KLIKFUN_FILE_INPUT_OK"
            echo ""
            echo "----- KLIKFUN SOURCE -----"
            cat /tmp/klikfun-source.txt
          } > /tmp/gemini-prompt.txt

          gemini \
            --prompt "$(cat /tmp/gemini-prompt.txt)" \
            --output-format text

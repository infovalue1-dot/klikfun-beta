name: Gemini Klikfun Controlled Change Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gemini-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare test source
        run: |
          printf '%s\n' \
            '<!doctype html>' \
            '<html lang="id">' \
            '<head><title>Klikfun Test</title></head>' \
            '<body>' \
            '<button id="play">Main</button>' \
            '</body>' \
            '</html>' \
            > /tmp/klikfun-test.html

      - name: Gemini controlled code change
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3-flash-preview
          GEMINI_CLI_TRUST_WORKSPACE: "true"
        run: |
          npm install --silent --no-audit --global @google/gemini-cli

          {
            echo "Modify ONLY the HTML source supplied below."
            echo "Do not access repository files."
            echo "Do not use tools."
            echo "Return ONLY the complete modified HTML. No markdown fences."
            echo "Make exactly one functional change:"
            echo "change the visible button text from Main to Mulai Main."
            echo "Do not change the button id or anything else."
            echo ""
            echo "----- SOURCE -----"
            cat /tmp/klikfun-test.html
          } > /tmp/gemini-prompt.txt

          gemini \
            --prompt "$(cat /tmp/gemini-prompt.txt)" \
            --output-format text > /tmp/gemini-result.html

          echo "----- GEMINI RESULT -----"
          cat /tmp/gemini-result.html

          grep -q '<button id="play">Mulai Main</button>' /tmp/gemini-result.html
          grep -q '<title>Klikfun Test</title>' /tmp/gemini-result.html

          echo "GEMINI_KLIKFUN_CONTROLLED_CHANGE_OK"